name: Biblioteca DevSecOps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate and test Compose
        run: |
          docker compose config --quiet
          docker compose up -d --build
          docker compose ps
          curl -fsS --retry 8 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/health
          curl -fsS --retry 8 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/ | grep -F 'Don Quijote'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing)" = 404
      - name: Stop demo
        if: always()
        run: docker compose down
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and export image
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t biblioteca-demo:"$GITHUB_SHA" .
          docker image save biblioteca-demo:"$GITHUB_SHA" -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-image
      - name: Push image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/biblioteca-demo:$GITHUB_SHA"
          docker load -i image.tar
          docker tag biblioteca-demo:"$GITHUB_SHA" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          docker logout ghcr.io
